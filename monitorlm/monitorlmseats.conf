[[inputs.exec]]
  commands = [
    "/usr/local/Wolfram/MathLM/monitorlm -template /etc/telegraf/telegraf.d/mlmtemplateusers.txt -text",
  ]
  data_format = "csv"
  csv_header_row_count = 1
  csv_skip_rows = 1
  csv_delimiter = ";"
  csv_trim_space = true


[inputs.exec.tags]
  source = "monitorlm_users"


[[processors.converter]]
  order = 1
  [processors.converter.fields]
    tag = ["client_host_IP","client_host","client_host_FQDN","client_host_domain","license_slot","user","user_uid","program"]

[[processors.enum]]
  order = 2
  [[processors.enum.mapping]]
    #field = "program"

    ## Name of the tag to map. Globs accepted.
    tag = "program"

    ## Destination tag or field to be used for the mapped value.  By default the
    ## source tag or field is used, overwriting the original value.
    dest = "status_code"

    ## Default value to be used for all values not contained in the mapping
    ## table.  When unset and no match is found, the original field will remain
    ## unmodified and the destination tag or field will not be created.
    # default = 0

    ## Table of mappings
    [processors.enum.mapping.value_mappings]
      KE = 1
      FE = 1


[[processors.converter]]
  order = 3
  [processors.converter.tags]
    integer = ["status_code"]

[[processors.starlark]]
  order = 4
  source = '''
def convert_duration_to_seconds(duration):
    days = 0
    hours = 0
    minutes = 0
    seconds = 0
  
    if 'd' in duration:
        parts = duration.split('d')
        days = int(parts[0].strip())
        duration = parts[1].strip()
    if 'h' in duration:
        parts = duration.split('h')
        hours = int(parts[0].strip())
        duration = parts[1].strip()
    if ':' in duration:
        parts = duration.split(':')
        if len(parts) == 3:
            hours = int(parts[0].strip())
            minutes = int(parts[1].strip())
            seconds = int(parts[2].strip())
        elif len(parts) == 2:
            minutes = int(parts[0].strip())
            seconds = int(parts[1].strip())
        else:
            seconds = int(parts[0].strip())
    total_seconds = days * 86400 + hours * 3600 + minutes * 60 + seconds
    return total_seconds

def apply(metric):
    if "session_duration" in metric.fields:
        duration = metric.fields["session_duration"]
        seconds = convert_duration_to_seconds(duration)
        metric.fields["session_duration"] = seconds
    return metric
'''

[[processors.rename]]
  order = 5
  [[processors.rename.replace]]
    measurement = "exec"
    dest = "monitorlm_seats"
